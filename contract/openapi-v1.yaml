{
  "openapi": "3.0.3",
  "info": {
    "title": "Cinema Collections Worker API",
    "version": "1.0.0",
    "description": "Authenticated, local-only API for catalog and compilation operations."
  },
  "servers": [{"url": "/"}],
  "security": [{"bearerAuth": []}],
  "paths": {
    "/api/v1/health": {"get": {"operationId": "getHealth", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Worker is alive", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Health"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/api/v1/status": {"get": {"operationId": "getStatus", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Operational status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Status"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/api/v1/collections": {
      "get": {"operationId": "listCollections", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Collection mappings", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Pagination"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}},
      "post": {"operationId": "createCollection", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CollectionCreate"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Collection"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}
    },
    "/api/v1/collections/{collection_id}": {
      "parameters": [{"$ref": "#/components/parameters/CollectionId"}],
      "patch": {"operationId": "patchCollection", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/Revision"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CollectionPatch"}}}}, "responses": {"200": {"description": "Updated", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Collection"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}
    },
    "/api/v1/profiles": {
      "get": {"operationId": "listProfiles", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Profiles", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Pagination"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}},
      "post": {"operationId": "createProfile", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileCreate"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Profile"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}
    },
    "/api/v1/profiles/{profile_id}": {
      "parameters": [{"$ref": "#/components/parameters/ProfileId"}],
      "patch": {"operationId": "patchProfile", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/Revision"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfilePatch"}}}}, "responses": {"200": {"description": "Updated", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Profile"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}
    },
    "/api/v1/clips": {"get": {"operationId": "listClips", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Clip catalog page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Pagination"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/api/v1/clips/{clip_id}": {"parameters": [{"$ref": "#/components/parameters/ClipId"}], "get": {"operationId": "getClip", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Clip", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Clip"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}},
    "/api/v1/scan": {"post": {"operationId": "startScan", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": false, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScanRequest"}}}}, "responses": {"202": {"description": "Scan accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/compile": {"post": {"operationId": "startCompile", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompileRequest"}}}}, "responses": {"202": {"description": "Compilation accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/jobs": {"get": {"operationId": "listJobs", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Job page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Pagination"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/api/v1/jobs/{job_id}": {"parameters": [{"$ref": "#/components/parameters/JobId"}], "get": {"operationId": "getJob", "security": [{"bearerAuth": []}], "responses": {"200": {"description": "Job and progress", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}},
    "/api/v1/jobs/{job_id}/cancel": {"parameters": [{"$ref": "#/components/parameters/JobId"}], "post": {"operationId": "cancelJob", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "responses": {"200": {"description": "Cancelled job", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelledJob"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/api/v1/logs": {"get": {"operationId": "listLogs", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Sanitized log page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Pagination"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/api/v1/cleanup-temporaries": {"post": {"operationId": "cleanupTemporaries", "security": [{"bearerAuth": []}], "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "responses": {"202": {"description": "Cleanup accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation"}, "429": {"$ref": "#/components/responses/RateLimited"}, "503": {"$ref": "#/components/responses/Unavailable"}}}}
  },
  "components": {
    "securitySchemes": {"bearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "WorkerToken"}},
    "parameters": {
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}},
      "Revision": {"name": "If-Match-Revision", "in": "header", "required": true, "schema": {"type": "integer", "minimum": 1}},
      "CollectionId": {"name": "collection_id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"}},
      "ProfileId": {"name": "profile_id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"}},
      "ClipId": {"name": "clip_id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}},
      "JobId": {"name": "job_id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}},
      "Page": {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}},
      "PageSize": {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}
    },
    "responses": {
      "Unauthorized": {"description": "Missing or invalid bearer token", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "Conflict": {"description": "Idempotency or optimistic-concurrency conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "Validation": {"description": "Request validation failed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "RateLimited": {"description": "Worker is busy; retry after backoff", "headers": {"Retry-After": {"schema": {"type": "integer"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "Unavailable": {"description": "Worker dependency or storage unavailable", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "NotFound": {"description": "Resource not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
    },
    "schemas": {
      "Error": {"type": "object", "required": ["code", "message", "retryable", "request_id"], "properties": {"code": {"type": "string"}, "message": {"type": "string"}, "details": {"nullable": true}, "retryable": {"type": "boolean"}, "request_id": {"type": "string", "format": "uuid"}}},
      "Health": {"type": "object", "required": ["status", "component", "worker_version", "api_version", "min_client_version", "max_client_version"], "properties": {"status": {"type": "string", "enum": ["ok"]}, "component": {"type": "string", "example": "cinema-collections-worker"}, "worker_version": {"type": "string"}, "api_version": {"type": "string"}, "min_client_version": {"type": "string"}, "max_client_version": {"type": "string"}}},
      "Status": {"type": "object", "required": ["queue_depth", "current_job", "storage", "scans", "latest_errors"], "properties": {"queue_depth": {"type": "integer", "minimum": 0}, "current_job": {"allOf": [{"$ref": "#/components/schemas/Job"}], "nullable": true}, "storage": {"type": "object", "additionalProperties": true}, "scans": {"type": "object", "additionalProperties": true}, "latest_errors": {"type": "array", "items": {"$ref": "#/components/schemas/Error"}}}},
      "Collection": {"type": "object", "required": ["id", "name", "enabled", "priority", "source_directory", "compiled_output_prefix", "processing_profile_id", "is_default", "allow_manual_override", "tags", "revision"], "properties": {"id": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"}, "name": {"type": "string"}, "enabled": {"type": "boolean"}, "priority": {"type": "integer"}, "source_directory": {"type": "string"}, "compiled_output_prefix": {"type": "string", "readOnly": true}, "start_datetime": {"type": "string", "format": "date-time", "nullable": true}, "end_datetime": {"type": "string", "format": "date-time", "nullable": true}, "processing_profile_id": {"type": "string"}, "is_default": {"type": "boolean"}, "allow_manual_override": {"type": "boolean"}, "tags": {"type": "array", "items": {"type": "string"}}, "notes": {"type": "string"}, "revision": {"type": "integer", "minimum": 1}}},
      "CollectionCreate": {"type": "object", "required": ["id", "name", "source_directory", "processing_profile_id"], "properties": {"id": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"}, "name": {"type": "string"}, "source_directory": {"type": "string"}, "processing_profile_id": {"type": "string"}, "enabled": {"type": "boolean", "default": true}, "is_default": {"type": "boolean", "default": false}, "worker_secret": {"type": "string", "format": "byte", "writeOnly": true}}},
      "CollectionPatch": {"type": "object", "minProperties": 1, "properties": {"name": {"type": "string"}, "enabled": {"type": "boolean"}, "priority": {"type": "integer"}, "source_directory": {"type": "string"}, "processing_profile_id": {"type": "string"}, "is_default": {"type": "boolean"}, "allow_manual_override": {"type": "boolean"}, "tags": {"type": "array", "items": {"type": "string"}}, "notes": {"type": "string"}}},
      "Profile": {"type": "object", "required": ["id", "name", "version", "settings", "revision"], "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "version": {"type": "integer", "minimum": 1}, "settings": {"type": "object", "additionalProperties": true}, "revision": {"type": "integer", "minimum": 1}}},
      "ProfileCreate": {"type": "object", "required": ["id", "name", "settings"], "properties": {"id": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"}, "name": {"type": "string"}, "settings": {"type": "object", "additionalProperties": true}, "asset_secret": {"type": "string", "writeOnly": true}}},
      "ProfilePatch": {"type": "object", "minProperties": 1, "properties": {"name": {"type": "string"}, "settings": {"type": "object", "additionalProperties": true}}},
      "Clip": {"type": "object", "required": ["id", "collection_id", "state", "relative_source_path", "relative_output_path", "duration_seconds", "output_available"], "properties": {"id": {"type": "string", "format": "uuid"}, "collection_id": {"type": "string"}, "state": {"type": "string", "enum": ["discovered", "invalid", "pending", "compiling", "ready", "failed", "stale"]}, "relative_source_path": {"type": "string"}, "relative_output_path": {"type": "string", "nullable": true}, "duration_seconds": {"type": "number", "minimum": 0}, "output_available": {"type": "boolean"}, "metadata": {"type": "object", "additionalProperties": true}}},
      "Progress": {"type": "object", "required": ["stage", "percent", "eta_seconds"], "properties": {"stage": {"type": "string", "enum": ["queued", "scanning", "probing", "encoding", "validating", "publishing", "complete", "cancelled", "failed"]}, "percent": {"type": "number", "minimum": 0, "maximum": 100}, "eta_seconds": {"type": "number", "minimum": 0, "nullable": true}}},
      "Job": {"type": "object", "required": ["id", "kind", "state", "progress", "created_at"], "properties": {"id": {"type": "string", "format": "uuid"}, "kind": {"type": "string", "enum": ["scan", "compile", "cleanup"]}, "state": {"type": "string", "enum": ["queued", "running", "succeeded", "failed", "cancelled"]}, "progress": {"$ref": "#/components/schemas/Progress"}, "created_at": {"type": "string", "format": "date-time"}, "finished_at": {"type": "string", "format": "date-time", "nullable": true}, "error": {"$ref": "#/components/schemas/Error", "nullable": true}}},
      "CancelledJob": {"allOf": [{"$ref": "#/components/schemas/Job"}], "description": "Job after cooperative cancellation; successful output is never removed."},
      "Pagination": {"type": "object", "required": ["items", "page", "page_size", "total"], "properties": {"items": {"type": "array", "items": {}}, "page": {"type": "integer", "minimum": 1}, "page_size": {"type": "integer", "minimum": 1}, "total": {"type": "integer", "minimum": 0}}},
      "ScanRequest": {"type": "object", "properties": {"collection_ids": {"type": "array", "items": {"type": "string"}}, "resume": {"type": "boolean", "default": true}}},
      "CompileRequest": {"type": "object", "required": ["collection_id"], "properties": {"collection_id": {"type": "string"}, "clip_ids": {"type": "array", "items": {"type": "string", "format": "uuid"}}, "strategy": {"type": "string", "enum": ["scan_and_compile_changed_or_missing", "compile_stale_only", "scan_only"]}, "skip_if_processing": {"type": "boolean", "default": true}}}
    }
  }
}
