name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip uv
      - run: uv sync --all-groups
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: pytest
