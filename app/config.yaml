name: Cinema Collections Worker
version: 1.6.2
slug: cinema_collections_worker
description: Safe media catalog, compilation queue, and Ingress library manager
url: https://github.com/NaturalDevCR/hass-clips-manager
arch:
  - aarch64
  - amd64
startup: application
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open
ports: {}
map:
  - data:rw
  - addon_config:rw
  - media:rw
options:
  bind_host: 0.0.0.0
  bind_port: 8099
  source_root: /media/cinema-collections/source
  compiled_root: /media/cinema-collections/compiled
  disk_reserve_bytes: 1073741824
schema:
  bearer_secret: password
  bind_host: str
  bind_port: port
  source_root: str
  compiled_root: str
  disk_reserve_bytes: int(0,)
